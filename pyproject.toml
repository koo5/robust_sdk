[project]
name = "robust-sdk2"
version = "0.1.0-alpha"
description = "Pythonic builders for Robust calculator request RDF"
authors = [
    {name = "lodgeit-labs"}
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2,<3",
    "rdflib>=7,<8",
    "requests>=2",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
